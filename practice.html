<section>
<h2>Day 1: Objectives that match what users need</h2>
<ol>
<li><p>Athar's uptime check sends one short English prompt a minute. Which of these incidents does it detect?</p><ul><li><b>A.</b> Arabic answers wrong after an index refresh</li><li><b>B.</b> First token over four seconds at the evening peak</li><li><b>C.</b> The engine pods restart and refuse every request</li><li><b>D.</b> Answers cut short at the output limit</li></ul></li>
<li><p>A customer closes the chat after two seconds, before Athar's first token. The gateway logs a 499. How should the availability indicator count it?</p><ul><li><b>A.</b> As a bad event</li><li><b>B.</b> As a good event</li><li><b>C.</b> As half a bad event</li><li><b>D.</b> Excluded from valid events, and counted in its own abandonment signal</li></ul></li>
<li><p>Over 30 days Athar served 2,000,000 valid requests and 6,000 failed. The availability objective is 99.5%. What share of the error budget remains?</p><ul><li><b>A.</b> 99.7%</li><li><b>B.</b> 0.3%</li><li><b>C.</b> 40%</li><li><b>D.</b> 167%</li></ul></li>
<li><p>Ruwaida asks for one headline indicator for the redelivery booking flow on her monthly review. Which do you propose?</p><ul><li><b>A.</b> Share of successful model and tool calls</li><li><b>B.</b> Share of sessions that booked a slot, per language</li><li><b>C.</b> Share of sessions not escalated to a person</li><li><b>D.</b> Median session duration</li></ul></li>
<li><p>Athar's availability objective is 99.5% of valid requests over 30 days. The month will see about 2,000,000 valid requests. After 10 days, 6,000 requests have failed. What percentage of the month's error budget has been spent? <span class="unit">(%)</span></p></li>
<li><p>Over a week Athar's graded answers pass 97% overall: 98.4% in English on 1,700 samples and 89% in Arabic on 300 samples. The objective is 95% of graded answers correct. What should the quality objective look like?</p><ul><li><b>A.</b> One overall objective: 97% already meets 95%, so the service is healthy</li><li><b>B.</b> No quality objective, since grading is only a sample</li><li><b>C.</b> One objective per language, each with its sample size and interval, so Arabic's 89% is visible and spends its own budget</li><li><b>D.</b> An Arabic objective of 89%, set to what the service does today</li></ul></li>
<li><p>Rebooking a delivery takes Athar five model or tool calls in a row; each succeeds 99% of the time, independently. About how often does the whole rebooking task succeed?</p><ul><li><b>A.</b> About 99%: the weakest call sets the rate</li><li><b>B.</b> About 95%: 0.99 to the power of 5</li><li><b>C.</b> About 99.9%: retries inside the task raise it</li><li><b>D.</b> It cannot be estimated without the calls' latencies</li></ul></li>
<li><p>Athar's pickup-request flow runs four steps in a row, each needing the one before: check_area passes 99.5% (0.5 s on average), price_quote 99.0% (1.8 s), book_courier 97.5% (1.0 s) and send_receipt 99.7% (0.4 s). The flow's objective is 97% of requests completed; its time objective is already met. Which single change brings the flow to its completion objective?</p><ul><li><b>A.</b> None is needed: every step passes 97.5% or more, so the flow completes at least 97.5%</li><li><b>B.</b> Halve the time of price_quote, about half of the flow's 3.7 s</li><li><b>C.</b> Make send_receipt perfect, raising it from 99.7% to 100%</li><li><b>D.</b> Raise book_courier from 97.5% to 99.5%</li></ul></li>
<li><p>An uptime probe that receives HTTP 200 from Athar every minute shows that users are getting correct answers.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Capacity and failure</h2>
<ol>
<li><p>Over 30 days Athar's sampled quality was 97.8% in English and 95.9% in Arabic, 96.7% together. The objective is 95%. What do you report?</p><ul><li><b>A.</b> 96.7%, within objective</li><li><b>B.</b> Each language against its own objective, with its remaining budget</li><li><b>C.</b> 97.8%, the higher of the two</li><li><b>D.</b> Nothing until every answer is graded</li></ul></li>
<li><p>A sweep gives goodput 3.1, 3.4, 3.5, 1.2 requests a second at 8, 12, 16 and 20 in flight. First-token p95 at 12 is 600 ms, at 16 it is 1,400 ms; the threshold is 1,500 ms. Where do you set the operating point?</p><ul><li><b>A.</b> 16 in flight</li><li><b>B.</b> 12 in flight</li><li><b>C.</b> 8 in flight</li><li><b>D.</b> 20 in flight</li></ul></li>
<li><p>During the sale-day surge Athar's replicas are at their cap. Which traffic should the gateway shed first?</p><ul><li><b>A.</b> The most recent arrivals, whatever their class</li><li><b>B.</b> Tracking requests, because they are the most numerous</li><li><b>C.</b> Staff summaries of complaint threads</li><li><b>D.</b> Arabic requests, because their prompts are longer</li></ul></li>
<li><p>Shuaib reports that the fallback model passes 84% of the test set, against a minimum service of 85%, "close enough to ship". English passes 92%, Arabic 79%. What do you decide?</p><ul><li><b>A.</b> Ship it: 84% is within a point</li><li><b>B.</b> Remove the fallback mode entirely</li><li><b>C.</b> Lower the minimum service to 80%</li><li><b>D.</b> Use it for English; route Arabic to the cache first and measure again</li></ul></li>
<li><p>A 30-second provider fault ended ten minutes ago. Athar still fails most requests, and the engine shows three times the normal request rate. What is the most likely cause?</p><ul><li><b>A.</b> Client retries keep the load past the knee, so goodput stays near zero</li><li><b>B.</b> A new provider fault started</li><li><b>C.</b> Half of the replicas were lost during the fault</li><li><b>D.</b> A traffic surge from a marketing campaign</li></ul></li>
<li><p>Each Athar replica serves 2.1 requests per second of goodput at its operating point. The busiest hour of the year averages 7.6 requests per second, and the team keeps 25% headroom above it. How many replicas are needed? <span class="unit">(replicas)</span></p></li>
<li><p>A load test shows throughput still rising up to 24 concurrent requests per replica, but beyond 16 the share of requests meeting the time-to-first-token objective falls quickly. Where should the admission limit be?</p><ul><li><b>A.</b> At 24, where throughput peaks</li><li><b>B.</b> At 16 or just below, where goodput (requests that meet the objective) is highest</li><li><b>C.</b> At 1, so that every request gets the fastest answer</li><li><b>D.</b> No limit: autoscaling will add replicas</li></ul></li>
<li><p>Athar is overloaded at 140% of its admission limit. Traffic is P1 parcel tracking for customers, P2 redelivery chat, and P3 bulk summaries of help articles for staff. What does the gateway do?</p><ul><li><b>A.</b> Queue everything in arrival order until the burst passes</li><li><b>B.</b> Reject a random 30% of all requests</li><li><b>C.</b> Shed P3 first, cap and give P2 a short queue deadline, and keep P1 within its objective</li><li><b>D.</b> Shed P1 first, since tracking questions can be retried</li></ul></li>
<li><p>Put the steps for setting an admission limit in order.</p><ul><li>Replay a recorded overload and check priority traffic still meets its objective</li><li>Choose the operating point where the objective is still met</li><li>Measure goodput against concurrency on the model you will serve</li><li>Compare capacity at that point with the busiest hour plus headroom</li></ul></li>
<li><p>Retrieval over the help articles is down. Which degraded mode should Athar use for help questions?</p><ul><li><b>A.</b> Serve vetted cached answers to known questions, disclose the reduced service, and send the rest to a template that points to the help centre</li><li><b>B.</b> Let the model answer from memory without retrieval, so users notice nothing</li><li><b>C.</b> Return an error for every question until retrieval is back</li><li><b>D.</b> Retry retrieval on every request until it answers</li></ul></li>
<li><p>Of 137 cached answers, 9 are tracking answers that contain a customer's name and address, and 7 quote a delivery fee that changed last month. What happens to the cache before it serves as a fallback?</p><ul><li><b>A.</b> Keep all 137: they were correct when written</li><li><b>B.</b> Remove only the 7 stale answers; personal data is fine in a server-side cache</li><li><b>C.</b> Remove only the 9 with personal data; prices change rarely</li><li><b>D.</b> Remove both: answers with personal data must not be served to others, and stale answers are wrong</li></ul></li>
<li><p>A provider timeout lasts 60 seconds. Clients retry every failure immediately, up to three times. After the provider recovers, the service stays overloaded. What fixes this?</p><ul><li><b>A.</b> More retries, so that more requests eventually succeed</li><li><b>B.</b> A retry budget (about 10% of requests) with exponential backoff and jitter</li><li><b>C.</b> A longer client timeout</li><li><b>D.</b> Restarting the service after each fault</li></ul></li>
<li><p>A chaos test of the smaller fallback model passes if Athar keeps returning HTTP 200 throughout the fault.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Incidents and safe releases</h2>
<ol>
<li><p>The engine is down. The fallback model passes 87% of English and 73% of Arabic test questions; the cache answers 63% of Arabic help questions, all correctly. The minimum service is 85% per language. What do Arabic help questions get?</p><ul><li><b>A.</b> The fallback model, like English</li><li><b>B.</b> An apology for every Arabic question</li><li><b>C.</b> The cache first, the fallback on a miss, both disclosed</li><li><b>D.</b> The full cache, including saved tracking answers</li></ul></li>
<li><p>After v2.4, 38% of Arabic answers fail and English is unchanged. Arabic is 60% of traffic. The 6× quality alert on all traffic never fires. Why?</p><ul><li><b>A.</b> Too few answers are graded to see it</li><li><b>B.</b> The English slice keeps the combined burn rate near 5×, below the threshold</li><li><b>C.</b> The five-minute window is too short</li><li><b>D.</b> The 95% objective is too strict</li></ul></li>
<li><p>The Arabic quality alert pages you; v2.4 went out 35 minutes ago. Put the first four actions in order.</p><ul><li>Start root-cause analysis</li><li>Roll back to v2.3</li><li>Declare the incident and assign the roles</li><li>Page the data protection officer once personal data is reported</li></ul></li>
<li><p>A canary ran 10 minutes at 5% and passed with 25 of 26 Arabic answers correct, against 97% for stable. What do you do before promoting?</p><ul><li><b>A.</b> Promote: 96% is within the 3-point margin</li><li><b>B.</b> Roll back: the sample is too small to trust</li><li><b>C.</b> Continue at a larger share until each language has the minimum sample</li><li><b>D.</b> Ask the evaluation team to approve by hand</li></ul></li>
<li><p>Four draft lines for INC-0731's contributing factors. Which one belongs in a blameless review?</p><ul><li><b>A.</b> The release engineer should have checked Arabic before shipping</li><li><b>B.</b> Human error during the template change</li><li><b>C.</b> Arabic customers received wrong answers</li><li><b>D.</b> The release pipeline had no gate on Arabic answer quality</li></ul></li>
<li><p>A page fires when the one-hour burn rate of a 30-day objective reaches 14.4. If the burn holds for exactly that hour, how much of the 30-day error budget is gone?</p><ul><li><b>A.</b> About 2%: 14.4 hours of budget-rate spending out of 720 hours</li><li><b>B.</b> 14.4%, the burn rate read as a percentage</li><li><b>C.</b> 0.1%, the gap between 99.9% and 100%</li><li><b>D.</b> Half the budget, since a page means the objective is at risk</li></ul></li>
<li><p>A quality alert pages 35 minutes after a model update: Arabic tracking answers have been wrong since the update. Put the first actions in order.</p><ul><li>Tell the stakeholders what is known and when the next update is due</li><li>Find the root cause from the logs, once users are protected</li><li>Declare the incident and name an incident lead</li><li>Mitigate: roll back to the previous model</li></ul></li>
<li><p>Twenty minutes into the incident the team suspects the new model mis-reads Arabic-Indic digits in parcel numbers, but is not sure. Users are still getting wrong answers. What does the incident lead decide?</p><ul><li><b>A.</b> Keep the new model until the root cause is proven, to avoid a needless rollback</li><li><b>B.</b> Roll back now and record the decision and its time in the log; prove the cause afterwards</li><li><b>C.</b> Patch the prompt template in production to normalise digits</li><li><b>D.</b> Ask each engineer to test Arabic queries by hand</li></ul></li>
<li><p>The blameless review of INC-0731 lists corrective actions. Which one prevents a repeat?</p><ul><li><b>A.</b> Remind release engineers to test Arabic carefully</li><li><b>B.</b> Note that the engineer on call missed the regression</li><li><b>C.</b> Shorten the alert's long window</li><li><b>D.</b> Add the failing Arabic digit cases as a regression test, and route model releases through a canary with a per-language quality gate</li></ul></li>
<li><p>During the incident, 40 answers showed parcels' recipient names and addresses to the wrong customers. Under SDAIA's personal data breach guide, what is the notification clock?</p><ul><li><b>A.</b> Notify within 72 hours of becoming aware of the breach, when it may harm the people concerned</li><li><b>B.</b> Notify only after the root cause is known</li><li><b>C.</b> No notification: the exposure was caused by a model error, not an attack</li><li><b>D.</b> Notify within 30 days, in the monthly report</li></ul></li>
<li><p>A canary of a quantised model passed its quality gate on 27 Arabic samples, then failed in production. What should the gate have required?</p><ul><li><b>A.</b> A higher pass threshold on the same 27 samples</li><li><b>B.</b> A longer canary at the same traffic share, with no other change</li><li><b>C.</b> A minimum sample per language before deciding, and a comparison against the stable version</li><li><b>D.</b> No gate: canaries only measure latency</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Integrity and readiness</h2>
<ol>
<li><p>INC-0731's review lists five contributing factors. Which corrective action would have stopped v2.4 before it reached all Arabic users?</p><ul><li><b>A.</b> Remind release engineers to test Arabic carefully</li><li><b>B.</b> Shorten the alert's long window to 30 minutes</li><li><b>C.</b> Fix the digit normalisation in the prompt template</li><li><b>D.</b> Route every model release through a canary with a per-language quality gate</li></ul></li>
<li><p>Every file of a downloaded model matches the hash list published on the same mirror. What can you conclude?</p><ul><li><b>A.</b> The files are the publisher's originals</li><li><b>B.</b> The files match that list, and nothing more until the list is verified</li><li><b>C.</b> The model may be used commercially</li><li><b>D.</b> The model will answer as well as the original</li></ul></li>
<li><p>A model folder and its signature bundle both came from a partner's file share, along with the public key to check them. The signature verifies. What has been shown?</p><ul><li><b>A.</b> The partner released these exact files</li><li><b>B.</b> The model contains no planted behaviour</li><li><b>C.</b> Only that the files match whoever holds that key, which could be anyone with access to the share</li><li><b>D.</b> Rasael may deploy it in production</li></ul></li>
<li><p>Four candidate models for the fallback mode. Rasael's allow list is Apache-2.0 and MIT. Which one passes all four rules?</p><ul><li><b>A.</b> Apache-2.0, signature mismatch on one shard</li><li><b>B.</b> Research-only licence, signature verified</li><li><b>C.</b> MIT, signature verified, safetensors files, BOM hashes match</li><li><b>D.</b> Apache-2.0, signature verified, weights in a pickled .bin file</li></ul></li>
<li><p>A service has every item met except two partial ones: its canary gates on latency only, and its fallback was never tested under a provider failure. Both have likelihood 4 and impact 4, so each scores a risk of 8. What do you decide under Rasael's rule?</p><ul><li><b>A.</b> Do not launch until both are fixed</li><li><b>B.</b> Launch with two dated conditions, each with the evidence that proves it</li><li><b>C.</b> Launch without conditions</li><li><b>D.</b> Ask the team to rerun their own checklist</li></ul></li>
<li><p>A partner's model folder arrives with a signature bundle and the public key to check it, all in the same file share. The signature verifies. What has been shown?</p><ul><li><b>A.</b> That the partner released these exact files</li><li><b>B.</b> That the files match whatever key was in the share, which anyone with access to the share could have replaced</li><li><b>C.</b> That the model is safe to load</li><li><b>D.</b> That Rasael may deploy it</li></ul></li>
<li><p>A small model's signature verifies with Rasael's release key and its bill of materials matches every file. Its licence allows research use only. What does the admission gate decide?</p><ul><li><b>A.</b> Admit: integrity is proven</li><li><b>B.</b> Admit with a warning in the log</li><li><b>C.</b> Ask the publisher to re-sign it</li><li><b>D.</b> Reject: the licence is not on the allow list</li></ul></li>
<li><p>One weight shard of a model downloaded from a mirror has a different SHA-256 from the publisher's list. What does that prove?</p><ul><li><b>A.</b> The bytes of that shard are not the ones the publisher released</li><li><b>B.</b> Someone tampered with it on purpose</li><li><b>C.</b> The mirror is malicious</li><li><b>D.</b> The model will behave differently</li></ul></li>
<li><p>Why does the admission gate refuse a model shipped as a pickled .bin file, even with a valid signature?</p><ul><li><b>A.</b> Pickle files are larger than safetensors</li><li><b>B.</b> Loading a pickle can run code, so a signed file can still carry code that runs at load</li><li><b>C.</b> Signatures cannot cover binary files</li><li><b>D.</b> The engine cannot read .bin files</li></ul></li>
<li><p>Which of these does a CycloneDX machine learning bill of materials record for a model? Choose all that apply.</p><ul><li><b>A.</b> The hash of each file</li><li><b>B.</b> The licence</li><li><b>C.</b> The publisher and version</li><li><b>D.</b> Whether the model's answers are correct</li></ul></li>
<li><p>Taqdir's team marks its latency objective as met: 95% of requests under 2 seconds to first token. Rasael's standard is 1.5 seconds. How does the review score it?</p><ul><li><b>A.</b> Met: the team's evidence shows its objective is met</li><li><b>B.</b> Missing: there is no 1.5-second measurement</li><li><b>C.</b> Partial: an objective exists and is measured, but it is weaker than the standard</li><li><b>D.</b> Not scored: the standard is the platform team's concern</li></ul></li>
<li><p>A finding has likelihood 4, impact 4 and is partial (gap 0.5). What is its risk, as likelihood × impact × gap?</p></li>
<li><p>Every checklist item for a service is met except one: its fallback model is unsigned (missing, impact 5). What is the decision under Rasael's rule?</p><ul><li><b>A.</b> Launch: twelve of thirteen items are met</li><li><b>B.</b> Launch with a condition to sign the model within 30 days</li><li><b>C.</b> Do not launch until the model is signed and admitted; then relaunch review</li><li><b>D.</b> Ask the team to rerun its own checklist</li></ul></li>
<li><p>What makes a launch condition usable?</p><ul><li><b>A.</b> It is written in the team's own words</li><li><b>B.</b> It names an owner, a date, and the evidence that proves it is met</li><li><b>C.</b> It lists every finding, whatever its risk</li><li><b>D.</b> It is approved by the panel</li></ul></li>
</ol>

he wrong way round: 0.5% over 0.3%"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-budget","title":"How much budget is left?"},"level":null,"pool":"checkpoint"},{"id":"check-flow-q1","type":"single","prompt":"Ruwaida asks for one headline indicator for the redelivery booking flow on her monthly review. Which do you propose?","options":[{"key":"A","text":"Share of successful model and tool calls"},{"key":"B","text":"Share of sessions that booked a slot, per language"},{"key":"C","text":"Share of sessions not escalated to a person"},{"key":"D","text":"Median session duration"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The customer's task is the booking. Completion per language measures it directly; cost and escalation sit beside it as context.","misconceptions":["Measures the parts, not the task: calls succeed while bookings fail","","Optimises the wrong direction: some parcels must be escalated","Measures speed, not success: a fast abandoned session still failed"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-flow","title":"Which indicator for the redelivery flow?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Over 30 days Athar's sampled quality was 97.8% in English and 95.9% in Arabic, 96.7% together. The objective is 95%. What do you report?","options":[{"key":"A","text":"96.7%, within objective"},{"key":"B","text":"Each language against its own objective, with its remaining budget"},{"key":"C","text":"97.8%, the higher of the two"},{"key":"D","text":"Nothing until every answer is graded"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The objective is per language: Arabic has 19% of its budget left while English has 57%, and only the slices show it.","misconceptions":["Averages the slices, which lets English hide how close Arabic is to its objective","","Reports the best slice as if it were the service","Drops the measurement because it is sampled, when the interval makes a sample usable"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which number goes on the objectives document?"},"level":null,"pool":"checkpoint"},{"id":"check-curve-q1","type":"single","prompt":"A sweep gives goodput 3.1, 3.4, 3.5, 1.2 requests a second at 8, 12, 16 and 20 in flight. First-token p95 at 12 is 600 ms, at 16 it is 1,400 ms; the threshold is 1,500 ms. Where do you set the operating point?","options":[{"key":"A","text":"16 in flight"},{"key":"B","text":"12 in flight"},{"key":"C","text":"8 in flight"},{"key":"D","text":"20 in flight"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"12 keeps 97% of the peak goodput with the p95 well under the threshold; 16 sits within 100 ms of it.","misconceptions":["Chooses the peak, leaving no headroom below the threshold","","Gives away capacity the curve shows is safe","Reads throughput past the knee as capacity"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-curve","title":"Read the curve"},"level":null,"pool":"checkpoint"},{"id":"check-shed-q1","type":"single","prompt":"During the sale-day surge Athar's replicas are at their cap. Which traffic should the gateway shed first?","options":[{"key":"A","text":"The most recent arrivals, whatever their class"},{"key":"B","text":"Tracking requests, because they are the most numerous"},{"key":"C","text":"Staff summaries of complaint threads"},{"key":"D","text":"Arabic requests, because their prompts are longer"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Summaries are batch work that can wait for the surge to pass, and their long prompts free the most capacity.","misconceptions":["Ranks by arrival order, which sheds whoever is unlucky rather than whoever can wait","Protects the cheapest requests rather than the most urgent ones","","Sheds by language, which fails one language's users unnoticed"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-shed","title":"Which traffic do you shed first?"},"level":null,"pool":"checkpoint"},{"id":"check-mode-q1","type":"single","prompt":"Shuaib reports that the fallback model passes 84% of the test set, against a minimum service of 85%, \"close enough to ship\". English passes 92%, Arabic 79%. What do you decide?","options":[{"key":"A","text":"Ship it: 84% is within a point"},{"key":"B","text":"Remove the fallback mode entirely"},{"key":"C","text":"Lower the minimum service to 80%"},{"key":"D","text":"Use it for English; route Arabic to the cache first and measure again"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The minimum service is per language. The fallback meets it for English only, so Arabic needs another rung, measured before it is trusted.","misconceptions":["Accepts an average that a 60% Arabic user base cannot rely on","Throws away a mode that works for English instead of routing","Changes the bar to fit the model instead of the users",""],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-mode","title":"The fallback passes overall"},"level":null,"pool":"checkpoint"},{"id":"check-storm-q1","type":"single","prompt":"A 30-second provider fault ended ten minutes ago. Athar still fails most requests, and the engine shows three times the normal request rate. What is the most likely cause?","options":[{"key":"A","text":"Client retries keep the load past the knee, so goodput stays near zero"},{"key":"B","text":"A new provider fault started"},{"key":"C","text":"Half of the replicas were lost during the fault"},{"key":"D","text":"A traffic surge from a marketing campaign"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Three times the normal rate right after a fault is the signature of retries. Shed load and enforce a retry budget; the service then recovers.","misconceptions":["","Assumes a second fault without evidence; the load points to retries","Confuses a capacity loss with a load increase","Blames users' real demand for load the fault created"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-storm","title":"The fault is gone; the outage is not"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"The engine is down. The fallback model passes 87% of English and 73% of Arabic test questions; the cache answers 63% of Arabic help questions, all correctly. The minimum service is 85% per language. What do Arabic help questions get?","options":[{"key":"A","text":"The fallback model, like English"},{"key":"B","text":"An apology for every Arabic question"},{"key":"C","text":"The cache first, the fallback on a miss, both disclosed"},{"key":"D","text":"The full cache, including saved tracking answers"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Routed this way, Arabic help passed 91.1% in Lab 2.3, above the minimum; the fallback alone gave 72.6%.","misconceptions":["Applies one route to both languages although their modes perform differently","Gives up a service that the cache can partly keep","","Serves cached answers without the freshness and personal-data checks"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which degraded mode for Arabic help questions?"},"level":null,"pool":"checkpoint"},{"id":"check-averaged-q1","type":"single","prompt":"After v2.4, 38% of Arabic answers fail and English is unchanged. Arabic is 60% of traffic. The 6× quality alert on all traffic never fires. Why?","options":[{"key":"A","text":"Too few answers are graded to see it"},{"key":"B","text":"The English slice keeps the combined burn rate near 5×, below the threshold"},{"key":"C","text":"The five-minute window is too short"},{"key":"D","text":"The 95% objective is too strict"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Averaging dilutes a one-language failure. The objective and its alert must be per language.","misconceptions":["Blames sampling, but the Arabic slice alone has enough samples to fire","","Confuses the two windows: the short window is above the threshold too","Treats the objective as the cause; any objective averaged over both languages hides the slice"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-averaged","title":"Why did the alert stay silent?"},"level":null,"pool":"checkpoint"},{"id":"check-first-action-q1","type":"order","prompt":"The Arabic quality alert pages you; v2.4 went out 35 minutes ago. Put the first four actions in order.","options":[{"key":"A","text":"Declare the incident and assign the roles"},{"key":"B","text":"Roll back to v2.3"},{"key":"C","text":"Page the data protection officer once personal data is reported"},{"key":"D","text":"Start root-cause analysis"}],"correct":[0,1,2,3],"answer":null,"tolerance":null,"unit":null,"explanation":"Roles first so decisions have an owner, then the reversible mitigation, then the breach procedure, and only then the diagnosis.","misconceptions":["","","",""],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-first-action","title":"Order the first actions"},"level":null,"pool":"checkpoint"},{"id":"check-canary-q1","type":"single","prompt":"A canary ran 10 minutes at 5% and passed with 25 of 26 Arabic answers correct, against 97% for stable. What do you do before promoting?","options":[{"key":"A","text":"Promote: 96% is within the 3-point margin"},{"key":"B","text":"Roll back: the sample is too small to trust"},{"key":"C","text":"Continue at a larger share until each language has the minimum sample"},{"key":"D","text":"Ask the evaluation team to approve by hand"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"26 answers cannot tell 97% from 90%. The gate holds the decision until the sample can.","misconceptions":["Treats a pass on a tiny sample as evidence of quality","Discards a candidate on no evidence of a problem","","Moves the decision to people without new evidence"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-canary","title":"The canary passed; should it have?"},"level":null,"pool":"checkpoint"},{"id":"check-factor-q1","type":"single","prompt":"Four draft lines for INC-0731's contributing factors. Which one belongs in a blameless review?","options":[{"key":"A","text":"The release engineer should have checked Arabic before shipping"},{"key":"B","text":"Human error during the template change"},{"key":"C","text":"Arabic customers received wrong answers"},{"key":"D","text":"The release pipeline had no gate on Arabic answer quality"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"It names a condition of the system, with an obvious owner and an action that removes it.","misconceptions":["Names a person's behaviour, which invites blame and no fix","Labels the cause instead of finding the condition behind it","States an outcome, not a condition anyone can change",""],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-factor","title":"Which line belongs in the review?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"INC-0731's review lists five contributing factors. Which corrective action would have stopped v2.4 before it reached all Arabic users?","options":[{"key":"A","text":"Remind release engineers to test Arabic carefully"},{"key":"B","text":"Shorten the alert's long window to 30 minutes"},{"key":"C","text":"Fix the digit normalisation in the prompt template"},{"key":"D","text":"Route every model release through a canary with a per-language quality gate"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The gate stops any Arabic quality regression, this one and the next, before it reaches everyone; the other actions are needed too, but none of them blocks the release.","misconceptions":["Asks people to try harder, with no check that it happened","Speeds up the response but lets the regression ship","Fixes this bug but not the next one the gate would catch",""],"lo":["LO4"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Which action closes INC-0731's biggest gap?"},"level":null,"pool":"checkpoint"},{"id":"check-hash-q1","type":"single","prompt":"Every file of a downloaded model matches the hash list published on the same mirror. What can you conclude?","options":[{"key":"A","text":"The files are the publisher's originals"},{"key":"B","text":"The files match that list, and nothing more until the list is verified"},{"key":"C","text":"The model may be used commercially"},{"key":"D","text":"The model will answer as well as the original"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A matching hash is only as trustworthy as the list; a list from the mirror can be changed with the files.","misconceptions":["Trusts a list that came through the same channel as the files","","Confuses integrity with permission to use","Confuses integrity with quality"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-hash","title":"The hashes match; is the model safe to admit?"},"level":null,"pool":"checkpoint"},{"id":"check-signature-q1","type":"single","prompt":"A model folder and its signature bundle both came from a partner's file share, along with the public key to check them. The signature verifies. What has been shown?","options":[{"key":"A","text":"The partner released these exact files"},{"key":"B","text":"The model contains no planted behaviour"},{"key":"C","text":"Only that the files match whoever holds that key, which could be anyone with access to the share"},{"key":"D","text":"Rasael may deploy it in production"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The key travelled with the files; anyone who could replace the files could replace the key. Get the partner's key through a separate, trusted channel.","misconceptions":["Assumes the key is genuine although it arrived with the files","Confuses integrity with safety","","Confuses integrity with licence"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-signature","title":"The signature verifies"},"level":null,"pool":"checkpoint"},{"id":"check-admission-q1","type":"single","prompt":"Four candidate models for the fallback mode. Rasael's allow list is Apache-2.0 and MIT. Which one passes all four rules?","options":[{"key":"A","text":"Apache-2.0, signature mismatch on one shard"},{"key":"B","text":"Research-only licence, signature verified"},{"key":"C","text":"MIT, signature verified, safetensors files, BOM hashes match"},{"key":"D","text":"Apache-2.0, signature verified, weights in a pickled .bin file"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Only C passes every rule: verified integrity, matching bill of materials, an allowed licence and no executable format.","misconceptions":["Accepts a signature that does not verify because the licence is fine","Treats a valid signature as permission to use","","Ignores that pickled weights can run code when loaded"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-admission","title":"Which artefact does the gate admit?"},"level":null,"pool":"checkpoint"},{"id":"check-launch-q1","type":"single","prompt":"A service has every item met except two partial ones: its canary gates on latency only, and its fallback was never tested under a provider failure. Both have likelihood 4 and impact 4, so each scores a risk of 8. What do you decide under Rasael's rule?","options":[{"key":"A","text":"Do not launch until both are fixed"},{"key":"B","text":"Launch with two dated conditions, each with the evidence that proves it"},{"key":"C","text":"Launch without conditions"},{"key":"D","text":"Ask the team to rerun their own checklist"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"No missing item has impact 5, so nothing blocks; each gap becomes a condition with a date and a proof.","misconceptions":["Blocks on partial items that the rule turns into conditions, not blockers","","Ignores real gaps because most items are met","Moves the decision elsewhere without adding evidence"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-launch","title":"Which launch decision?"},"level":null,"pool":"checkpoint"},{"id":"q-slo-budget-burn","type":"numeric","prompt":"Athar's availability objective is 99.5% of valid requests over 30 days. The month will see about 2,000,000 valid requests. After 10 days, 6,000 requests have failed. What percentage of the month's error budget has been spent?","options":[],"correct":[],"answer":60,"tolerance":1,"unit":"%","explanation":"The budget is 0.5% of 2,000,000 = 10,000 failed requests; 6,000 of 10,000 is 60%.","misconceptions":[],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-slo-fast-burn","type":"single","prompt":"A page fires when the one-hour burn rate of a 30-day objective reaches 14.4. If the burn holds for exactly that hour, how much of the 30-day error budget is gone?","options":[{"key":"A","text":"About 2%: 14.4 hours of budget-rate spending out of 720 hours"},{"key":"B","text":"14.4%, the burn rate read as a percentage"},{"key":"C","text":"0.1%, the gap between 99.9% and 100%"},{"key":"D","text":"Half the budget, since a page means the objective is at risk"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A burn rate of 1 spends the budget evenly over 720 hours; 14.4 for one hour spends 14.4/720, which is 2%.","misconceptions":["","Reads the burn rate as a share of the budget","Confuses the objective's error rate with the budget spent","Equates a page with a fixed, large loss"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-slo-per-language","type":"single","prompt":"Over a week Athar's graded answers pass 97% overall: 98.4% in English on 1,700 samples and 89% in Arabic on 300 samples. The objective is 95% of graded answers correct. What should the quality objective look like?","options":[{"key":"A","text":"One overall objective: 97% already meets 95%, so the service is healthy"},{"key":"B","text":"No quality objective, since grading is only a sample"},{"key":"C","text":"One objective per language, each with its sample size and interval, so Arabic's 89% is visible and spends its own budget"},{"key":"D","text":"An Arabic objective of 89%, set to what the service does today"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"An overall rate lets the larger English traffic hide a failing Arabic service; per-language objectives with sample sizes show it.","misconceptions":["Trusts an average that the larger group dominates","Thinks a sampled signal cannot carry an objective","","Sets the objective from current performance instead of what users need"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-slo-task","type":"single","prompt":"Rebooking a delivery takes Athar five model or tool calls in a row; each succeeds 99% of the time, independently. About how often does the whole rebooking task succeed?","options":[{"key":"A","text":"About 99%: the weakest call sets the rate"},{"key":"B","text":"About 95%: 0.99 to the power of 5"},{"key":"C","text":"About 99.9%: retries inside the task raise it"},{"key":"D","text":"It cannot be estimated without the calls' latencies"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Independent steps multiply: 0.99^5 is about 0.951, so an objective per call overstates what users get per task.","misconceptions":["Thinks a chain is as good as its weakest link","","Assumes retries that the scenario does not have","Confuses success with latency"],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-slo-chain-step","type":"single","prompt":"Athar's pickup-request flow runs four steps in a row, each needing the one before: check_area passes 99.5% (0.5 s on average), price_quote 99.0% (1.8 s), book_courier 97.5% (1.0 s) and send_receipt 99.7% (0.4 s). The flow's objective is 97% of requests completed; its time objective is already met. Which single change brings the flow to its completion objective?","options":[{"key":"A","text":"None is needed: every step passes 97.5% or more, so the flow completes at least 97.5%"},{"key":"B","text":"Halve the time of price_quote, about half of the flow's 3.7 s"},{"key":"C","text":"Make send_receipt perfect, raising it from 99.7% to 100%"},{"key":"D","text":"Raise book_courier from 97.5% to 99.5%"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Success multiplies along the chain: 0.995 × 0.990 × 0.975 × 0.997 is about 0.958, short of 97%. Raising book_courier to 99.5% gives about 0.977. A perfect send_receipt gives only 0.960, and halving price_quote saves 0.9 s but leaves completion at 95.8%.","misconceptions":["Thinks a chain is as good as its weakest step","Fixes the slowest step when the missed objective is completion","Polishes a step that is already strong, which barely moves the product",""],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-slo-probe","type":"tf","prompt":"An uptime probe that receives HTTP 200 from Athar every minute shows that users are getting correct answers.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A probe sees that the endpoint answers, not what it answers: empty or wrong answers also return 200.","misconceptions":["Equates a reachable endpoint with a working assistant",""],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-cap-replicas","type":"numeric","prompt":"Each Athar replica serves 2.1 requests per second of goodput at its operating point. The busiest hour of the year averages 7.6 requests per second, and the team keeps 25% headroom above it. How many replicas are needed?","options":[],"correct":[],"answer":5,"tolerance":0,"unit":"replicas","explanation":"7.6 × 1.25 = 9.5 requests per second; 9.5 / 2.1 = 4.5, so 5 replicas.","misconceptions":[],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-cap-goodput","type":"single","prompt":"A load test shows throughput still rising up to 24 concurrent requests per replica, but beyond 16 the share of requests meeting the time-to-first-token objective falls quickly. Where should the admission limit be?","options":[{"key":"A","text":"At 24, where throughput peaks"},{"key":"B","text":"At 16 or just below, where goodput (requests that meet the objective) is highest"},{"key":"C","text":"At 1, so that every request gets the fastest answer"},{"key":"D","text":"No limit: autoscaling will add replicas"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Requests that miss the objective are not service; the limit sits where goodput peaks, not raw throughput.","misconceptions":["Counts answered requests whether or not they meet the objective","","Ignores cost: the objective, not the fastest answer, is the target","Assumes scaling is instant and unlimited during a burst"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-cap-shed","type":"single","prompt":"Athar is overloaded at 140% of its admission limit. Traffic is P1 parcel tracking for customers, P2 redelivery chat, and P3 bulk summaries of help articles for staff. What does the gateway do?","options":[{"key":"A","text":"Queue everything in arrival order until the burst passes"},{"key":"B","text":"Reject a random 30% of all requests"},{"key":"C","text":"Shed P3 first, cap and give P2 a short queue deadline, and keep P1 within its objective"},{"key":"D","text":"Shed P1 first, since tracking questions can be retried"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Shedding by priority keeps the most important traffic within its objective while the overload lasts.","misconceptions":["Thinks queues absorb any overload; they turn it into latency for everyone","Treats all traffic as equal","","Lets retries justify shedding the most valuable traffic"],"lo":["LO2","LO3"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-cap-order","type":"order","prompt":"Put the steps for setting an admission limit in order.","options":[{"key":"A","text":"Measure goodput against concurrency on the model you will serve"},{"key":"B","text":"Choose the operating point where the objective is still met"},{"key":"C","text":"Compare capacity at that point with the busiest hour plus headroom"},{"key":"D","text":"Replay a recorded overload and check priority traffic still meets its objective"}],"correct":[0,1,2,3],"answer":null,"tolerance":null,"unit":null,"explanation":"The limit comes from measurement, is sized against the busiest hour, and is proven by a replay.","misconceptions":["","","",""],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-deg-outage","type":"single","prompt":"Retrieval over the help articles is down. Which degraded mode should Athar use for help questions?","options":[{"key":"A","text":"Serve vetted cached answers to known questions, disclose the reduced service, and send the rest to a template that points to the help centre"},{"key":"B","text":"Let the model answer from memory without retrieval, so users notice nothing"},{"key":"C","text":"Return an error for every question until retrieval is back"},{"key":"D","text":"Retry retrieval on every request until it answers"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A degraded mode keeps a minimum, honest service; answering without sources invents policy and retries add load.","misconceptions":["","Thinks fluent answers without sources are a safe fallback","Gives up a minimum service the case can still provide","Retries against a dependency that is down, adding load"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-deg-cache-pd","type":"single","prompt":"Of 137 cached answers, 9 are tracking answers that contain a customer's name and address, and 7 quote a delivery fee that changed last month. What happens to the cache before it serves as a fallback?","options":[{"key":"A","text":"Keep all 137: they were correct when written"},{"key":"B","text":"Remove only the 7 stale answers; personal data is fine in a server-side cache"},{"key":"C","text":"Remove only the 9 with personal data; prices change rarely"},{"key":"D","text":"Remove both: answers with personal data must not be served to others, and stale answers are wrong"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A cache served to anyone must hold no personal data and no stale facts.","misconceptions":["Treats a once-correct answer as permanently correct","Ignores that a cached answer is shown to other users","Ignores that a stale price is a wrong answer",""],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-deg-retry","type":"single","prompt":"A provider timeout lasts 60 seconds. Clients retry every failure immediately, up to three times. After the provider recovers, the service stays overloaded. What fixes this?","options":[{"key":"A","text":"More retries, so that more requests eventually succeed"},{"key":"B","text":"A retry budget (about 10% of requests) with exponential backoff and jitter"},{"key":"C","text":"A longer client timeout"},{"key":"D","text":"Restarting the service after each fault"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Immediate retries multiply load past capacity, so goodput collapses; a budget and backoff bound the extra load.","misconceptions":["Thinks retries are free","","Delays the failure without reducing load","Treats a load problem as a process problem"],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-deg-quality","type":"tf","prompt":"A chaos test of the smaller fallback model passes if Athar keeps returning HTTP 200 throughout the fault.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The fallback in the case kept answering, but its Arabic quality fell to about 73%; each mode needs its quality measured per language.","misconceptions":["Equates availability with a minimum service",""],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-inc-order","type":"order","prompt":"A quality alert pages 35 minutes after a model update: Arabic tracking answers have been wrong since the update. Put the first actions in order.","options":[{"key":"A","text":"Declare the incident and name an incident lead"},{"key":"B","text":"Mitigate: roll back to the previous model"},{"key":"C","text":"Tell the stakeholders what is known and when the next update is due"},{"key":"D","text":"Find the root cause from the logs, once users are protected"}],"correct":[0,1,2,3],"answer":null,"tolerance":null,"unit":null,"explanation":"Roles first, then stop the harm, then communicate; diagnosis comes after users are protected.","misconceptions":["","","",""],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-inc-rollback","type":"single","prompt":"Twenty minutes into the incident the team suspects the new model mis-reads Arabic-Indic digits in parcel numbers, but is not sure. Users are still getting wrong answers. What does the incident lead decide?","options":[{"key":"A","text":"Keep the new model until the root cause is proven, to avoid a needless rollback"},{"key":"B","text":"Roll back now and record the decision and its time in the log; prove the cause afterwards"},{"key":"C","text":"Patch the prompt template in production to normalise digits"},{"key":"D","text":"Ask each engineer to test Arabic queries by hand"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Mitigation does not wait for certainty: a rollback is cheap and reversible, and the log records why.","misconceptions":["Puts the diagnosis before the users' harm","","Makes an untested change during the incident","Relies on people to catch what a gate should"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-inc-action","type":"single","prompt":"The blameless review of INC-0731 lists corrective actions. Which one prevents a repeat?","options":[{"key":"A","text":"Remind release engineers to test Arabic carefully"},{"key":"B","text":"Note that the engineer on call missed the regression"},{"key":"C","text":"Shorten the alert's long window"},{"key":"D","text":"Add the failing Arabic digit cases as a regression test, and route model releases through a canary with a per-language quality gate"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A test and a gate catch the failure every time; reminders and blame do not change the system.","misconceptions":["Relies on people remembering","Turns a review into blame","Changes detection speed but not prevention",""],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-inc-breach","type":"single","prompt":"During the incident, 40 answers showed parcels' recipient names and addresses to the wrong customers. Under SDAIA's personal data breach guide, what is the notification clock?","options":[{"key":"A","text":"Notify within 72 hours of becoming aware of the breach, when it may harm the people concerned"},{"key":"B","text":"Notify only after the root cause is known"},{"key":"C","text":"No notification: the exposure was caused by a model error, not an attack"},{"key":"D","text":"Notify within 30 days, in the monthly report"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The clock starts at awareness, not at the root cause, and a model error that exposes personal data is a breach.","misconceptions":["","Waits for diagnosis before notifying","Thinks only attacks are breaches","Confuses breach notification with routine reporting"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-inc-canary","type":"single","prompt":"A canary of a quantised model passed its quality gate on 27 Arabic samples, then failed in production. What should the gate have required?","options":[{"key":"A","text":"A higher pass threshold on the same 27 samples"},{"key":"B","text":"A longer canary at the same traffic share, with no other change"},{"key":"C","text":"A minimum sample per language before deciding, and a comparison against the stable version"},{"key":"D","text":"No gate: canaries only measure latency"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"27 samples give an interval too wide to decide; a minimum sample per language makes the gate's decision trustworthy.","misconceptions":["Tightens a threshold that the sample cannot support","Waits without checking whether enough samples arrive","","Thinks quality cannot be gated"],"lo":["LO4","LO1"],"day":3,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-int-key","type":"single","prompt":"A partner's model folder arrives with a signature bundle and the public key to check it, all in the same file share. The signature verifies. What has been shown?","options":[{"key":"A","text":"That the partner released these exact files"},{"key":"B","text":"That the files match whatever key was in the share, which anyone with access to the share could have replaced"},{"key":"C","text":"That the model is safe to load"},{"key":"D","text":"That Rasael may deploy it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Verification is only as trusted as the key; a key that travels with the model can be swapped with it.","misconceptions":["Trusts a key from the same channel as the files","","Confuses integrity with safety","Confuses integrity with permission"],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-int-licence","type":"single","prompt":"A small model's signature verifies with Rasael's release key and its bill of materials matches every file. Its licence allows research use only. What does the admission gate decide?","options":[{"key":"A","text":"Admit: integrity is proven"},{"key":"B","text":"Admit with a warning in the log"},{"key":"C","text":"Ask the publisher to re-sign it"},{"key":"D","text":"Reject: the licence is not on the allow list"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Integrity is not permission: every rule must pass, including the licence.","misconceptions":["Treats a valid signature as the only rule","Turns a failed rule into a warning","Thinks signing changes the licence",""],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-int-mirror","type":"single","prompt":"One weight shard of a model downloaded from a mirror has a different SHA-256 from the publisher's list. What does that prove?","options":[{"key":"A","text":"The bytes of that shard are not the ones the publisher released"},{"key":"B","text":"Someone tampered with it on purpose"},{"key":"C","text":"The mirror is malicious"},{"key":"D","text":"The model will behave differently"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A hash difference proves the bytes differ, not who changed them, why, or what the change does.","misconceptions":["","Infers intent from a hash","Infers the source of the change","Infers behaviour from bytes"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-int-pickle","type":"single","prompt":"Why does the admission gate refuse a model shipped as a pickled .bin file, even with a valid signature?","options":[{"key":"A","text":"Pickle files are larger than safetensors"},{"key":"B","text":"Loading a pickle can run code, so a signed file can still carry code that runs at load"},{"key":"C","text":"Signatures cannot cover binary files"},{"key":"D","text":"The engine cannot read .bin files"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Signing proves who released the bytes, not that loading them is safe; formats that run code at load are refused.","misconceptions":["Thinks the rule is about size","","Thinks signatures only cover text","Thinks the rule is about compatibility"],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-int-bom","type":"multi","prompt":"Which of these does a CycloneDX machine learning bill of materials record for a model? Choose all that apply.","options":[{"key":"A","text":"The hash of each file"},{"key":"B","text":"The licence"},{"key":"C","text":"The publisher and version"},{"key":"D","text":"Whether the model's answers are correct"}],"correct":[0,1,2],"answer":null,"tolerance":null,"unit":null,"explanation":"A bill of materials records what a release contains and where it came from, not how well it performs.","misconceptions":["","","","Confuses an inventory with an evaluation"],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-prr-claim","type":"single","prompt":"Taqdir's team marks its latency objective as met: 95% of requests under 2 seconds to first token. Rasael's standard is 1.5 seconds. How does the review score it?","options":[{"key":"A","text":"Met: the team's evidence shows its objective is met"},{"key":"B","text":"Missing: there is no 1.5-second measurement"},{"key":"C","text":"Partial: an objective exists and is measured, but it is weaker than the standard"},{"key":"D","text":"Not scored: the standard is the platform team's concern"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A reviewer checks the claim against the standard; meeting a weaker objective is partial.","misconceptions":["Accepts the team's word for the score","Ignores the measured evidence that exists","","Leaves the standard out of the review"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-prr-risk","type":"numeric","prompt":"A finding has likelihood 4, impact 4 and is partial (gap 0.5). What is its risk, as likelihood × impact × gap?","options":[],"correct":[],"answer":8,"tolerance":0,"unit":"","explanation":"4 × 4 × 0.5 = 8, which makes it a dated condition under Rasael's rule.","misconceptions":[],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-prr-decision","type":"single","prompt":"Every checklist item for a service is met except one: its fallback model is unsigned (missing, impact 5). What is the decision under Rasael's rule?","options":[{"key":"A","text":"Launch: twelve of thirteen items are met"},{"key":"B","text":"Launch with a condition to sign the model within 30 days"},{"key":"C","text":"Do not launch until the model is signed and admitted; then relaunch review"},{"key":"D","text":"Ask the team to rerun its own checklist"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Any missing item with impact 5 blocks the launch until fixed; a count of met items does not outweigh it.","misconceptions":["Counts items instead of weighing risk","Turns a blocking item into a condition","","Lets the team grade itself"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-prr-condition","type":"single","prompt":"What makes a launch condition usable?","options":[{"key":"A","text":"It is written in the team's own words"},{"key":"B","text":"It names an owner, a date, and the evidence that proves it is met"},{"key":"C","text":"It lists every finding, whatever its risk"},{"key":"D","text":"It is approved by the panel"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A condition without an owner, a date and a proof cannot be checked or closed.","misconceptions":["Thinks ownership of wording is ownership of the work","","Confuses a condition list with the findings list","Thinks approval replaces evidence"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"}]}</script>
